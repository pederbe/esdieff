name: Bug report
description: Something failed or produced an unexpected result.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What happened, and how does it affect your task?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: |
        What should happen instead? You do not need to propose a fix.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Include the smallest model or input, commands, output or error, version or commit, operating system and architecture where available. Describe your observations even if you cannot reproduce the problem yet, and say which details are unknown.
    validations:
      required: true
