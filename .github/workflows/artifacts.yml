name: Release artifacts

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, or empty to use Cargo.toml
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and install on ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            ext: ''
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            ext: ''
          - os: macos-15
            target: aarch64-apple-darwin
            ext: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      TARGET: ${{ matrix.target }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            . -> target
            tools/release -> target
          key: artifact-${{ matrix.target }}
      - uses: ./.github/actions/tool
        with:
          tool: cargo-about@0.9.3
          binary: cargo-about
      - uses: ./.github/actions/tool
        with:
          tool: dist@0.33.1
          binary: dist
          script: bash scripts/install-dist.sh
      - name: Build the retained archive
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          tag=${TAG:-v$version}
          test "$tag" = "v$version"
          cargo run --locked --manifest-path tools/release/Cargo.toml -- licenses "$TARGET" target/THIRD-PARTY-LICENSES.md
          dist build --artifacts local --target "$TARGET" --tag "$tag"
      - name: Check the native musl application
        if: runner.os == 'Linux'
        run: cargo test --locked --target "$TARGET" --no-fail-fast
      - name: Make tar entries compatible with Binstall
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          prefix=esdieff-$TARGET
          archive=$PWD/target/distrib/$prefix.tar.xz
          work=$(mktemp -d "$RUNNER_TEMP/esdieff-tar.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          tar -xJf "$archive" -C "$work"
          # Binstall skips GNU sparse entries. Ustar retains ordinary files.
          tar --format ustar -cJf "$archive" -C "$work" "$prefix"
          cd target/distrib
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$prefix.tar.xz" > "$prefix.tar.xz.sha256"
          else
            sha256sum "$prefix.tar.xz" > "$prefix.tar.xz.sha256"
          fi
      - name: Install and exercise the archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/esdieff-install"
          cd target/distrib
          if [[ "$TARGET" == *windows* ]]; then
            sha256sum -c "esdieff-$TARGET.zip.sha256"
            powershell -NoProfile -Command "Expand-Archive -LiteralPath 'esdieff-$TARGET.zip' -DestinationPath '$RUNNER_TEMP/esdieff-install'"
          else
            if [ "$RUNNER_OS" = macOS ]; then
              shasum -a 256 -c "esdieff-$TARGET.tar.xz.sha256"
            else
              sha256sum -c "esdieff-$TARGET.tar.xz.sha256"
            fi
            tar -xJf "esdieff-$TARGET.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/esdieff-install"
          fi
          cd ../..
          cargo run --locked --manifest-path tools/release/Cargo.toml -- smoke "$RUNNER_TEMP/esdieff-install/esdieff${{ matrix.ext }}"
          if [[ "$TARGET" == *linux* ]]; then
            binary=$RUNNER_TEMP/esdieff-install/esdieff
            readelf -l "$binary" > "$RUNNER_TEMP/program-headers.txt"
            readelf -d "$binary" > "$RUNNER_TEMP/dynamic-section.txt"
            if grep -E '^[[:space:]]*INTERP[[:space:]]' "$RUNNER_TEMP/program-headers.txt" ||
               grep -F '(NEEDED)' "$RUNNER_TEMP/dynamic-section.txt"; then exit 1; fi
            # This root has no loader or libraries, so the delivered binary must
            # perform useful work without an installed C runtime.
            mkdir "$RUNNER_TEMP/static-root"
            cp "$binary" "$RUNNER_TEMP/static-root/esdieff"
            cp examples/thermostat-check/rich.sdf.json "$RUNNER_TEMP/static-root/model.sdf.json"
            sudo chroot "$RUNNER_TEMP/static-root" /esdieff check /model.sdf.json
            sudo rm -rf "$RUNNER_TEMP/static-root"
          fi
          rm -rf "$RUNNER_TEMP/esdieff-install"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archives-${{ matrix.target }}
          path: |
            target/distrib/esdieff-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 30
      # Later jobs reuse this build of the release helper instead of compiling it again.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-tool-${{ matrix.target }}
          path: tools/release/target/debug/esdieff-release${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  packages:
    name: Signed package installation on ${{ matrix.os }}
    needs: build
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: archives-${{ matrix.target }}
          path: target/distrib
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-tool-${{ matrix.target }}
          path: target/release-tool
      - name: Install standard package tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends rpm cpio apt-utils createrepo-c gnupg gnupg2 xz-utils
          for image in ubuntu:22.04 ubuntu:24.04 fedora:44; do docker pull "$image"; done
      - name: Prepare native packages and check signed upgrades
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          tool=$PWD/target/release-tool/esdieff-release
          chmod +x "$tool"
          archive=$PWD/target/distrib/esdieff-$TARGET.tar.xz
          mkdir -p "$RUNNER_TEMP/packages" "$RUNNER_TEMP/previous"
          "$tool" package-linux "$archive" "$TARGET" "$version" "$RUNNER_TEMP/packages"
          # Use the current release's GNU payload when available, so the upgrade
          # also exercises the C runtime transition before the first musl release.
          previous_archive=$archive
          previous_target=$TARGET
          gnu=${TARGET%-musl}-gnu
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/previous-release.json"
          if jq -e --arg name "esdieff-$gnu.tar.xz" '.assets | any(.name == $name)' "$RUNNER_TEMP/previous-release.json" >/dev/null; then
            tag=$(jq -r .tag_name "$RUNNER_TEMP/previous-release.json")
            mkdir "$RUNNER_TEMP/gnu-previous"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/gnu-previous" \
              --pattern "esdieff-$gnu.tar.xz" --pattern "esdieff-$gnu.tar.xz.sha256"
            (cd "$RUNNER_TEMP/gnu-previous"; sha256sum -c "esdieff-$gnu.tar.xz.sha256")
            previous_archive=$RUNNER_TEMP/gnu-previous/esdieff-$gnu.tar.xz
            previous_target=$gnu
          fi
          "$tool" package-linux "$previous_archive" "$previous_target" 0.0.0 "$RUNNER_TEMP/previous"
          export GNUPGHOME=$RUNNER_TEMP/signing
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key 'Esdieff package check' rsa4096 sign 0
          gpg --armor --export > "$RUNNER_TEMP/check.asc"
          "$tool" repository "$RUNNER_TEMP/repository" "$RUNNER_TEMP/check.asc" "$RUNNER_TEMP/previous/"*.deb "$RUNNER_TEMP/previous/"*.rpm
          "$tool" repository "$RUNNER_TEMP/repository" "$RUNNER_TEMP/check.asc" "$RUNNER_TEMP/packages/"*.deb "$RUNNER_TEMP/packages/"*.rpm
          bash scripts/check-packages.sh "$RUNNER_TEMP/repository" "$version" "$archive"
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 30

  homebrew:
    name: Homebrew installation on ${{ matrix.os }}
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: archives-*
          path: target/distrib
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-tool-${{ matrix.target }}
          path: target/release-tool
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # main
        with:
          stable: true
      - name: Check formula, installation, upgrade and removal from a temporary tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          tool=$PWD/target/release-tool/esdieff-release
          chmod +x "$tool"
          "$tool" homebrew target/distrib "$version"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          brew tap-new esdieff/check
          formula=$(brew --repository esdieff/check)/Formula/esdieff.rb
          cp target/distrib/esdieff.rb "$formula"
          brew trust esdieff/check
          brew style esdieff/check/esdieff
          brew readall --aliases --os=all --arch=all esdieff/check
          brew audit --except=installed esdieff/check/esdieff
          # Cache the exact artifacts so the private check needs no public release.
          mkdir -p "$(brew --cache)/downloads"
          for archive in target/distrib/*.tar.xz; do
            name=$(basename "$archive")
            hash=$(printf '%s' "https://github.com/pederbe/esdieff/releases/download/v$version/$name" | shasum -a 256 | cut -d' ' -f1)
            cp "$archive" "$(brew --cache)/downloads/$hash--$name"
          done
          cp "$formula" "$RUNNER_TEMP/current.rb"
          sed -i.bak '/^  homepage /a\
            version "0.0.0"\
          ' "$formula"
          brew install esdieff/check/esdieff
          cp "$RUNNER_TEMP/current.rb" "$formula"
          brew upgrade esdieff/check/esdieff
          brew test esdieff/check/esdieff
          "$tool" smoke "$(brew --prefix)/bin/esdieff"
          brew uninstall esdieff/check/esdieff
          test ! -e "$(brew --prefix)/bin/esdieff"

  winget:
    name: WinGet portable installation
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: archives-x86_64-pc-windows-msvc
          path: target/distrib
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-tool-x86_64-pc-windows-msvc
          path: target/release-tool
      - name: Generate the portable manifest
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          target/release-tool/esdieff-release.exe winget target/distrib "$version"
      # The WinGet client and its x64 dependencies are about 300 MB, so they are cached by
      # version instead of being downloaded from GitHub on every run.
      - id: winget-client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/winget-client
          key: winget-client-1.29.380-x64
      - name: Download the qualified WinGet client
        if: steps.winget-client.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $release = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380'
          $client = "$env:RUNNER_TEMP/winget-client"
          $download = "$env:RUNNER_TEMP/winget-download"
          New-Item -ItemType Directory -Force "$client/dependencies", $download | Out-Null
          $files = @{
            'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle' = '65dea9c01ce08ee7b763366b27c0e651f97db857c11ca9b9c301826c10092f2e'
            'DesktopAppInstaller_Dependencies.zip' = 'ba875afe9d190f61218985ac0292a99d1db710bf93e13c68944ca9d89f0d82d1'
          }
          foreach ($name in $files.Keys) {
            Invoke-WebRequest "$release/$name" -OutFile "$download/$name" -MaximumRetryCount 3 -RetryIntervalSec 5
            if ((Get-FileHash "$download/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $files[$name]) { throw "$name checksum mismatch" }
          }
          Move-Item "$download/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" $client
          Expand-Archive "$download/DesktopAppInstaller_Dependencies.zip" "$download/dependencies"
          Get-ChildItem "$download/dependencies" -Recurse -File -Filter *.appx | Where-Object { $_.DirectoryName -match 'x64$' } | Move-Item -Destination "$client/dependencies"
          if (-not (Get-ChildItem "$client/dependencies" -Filter *.appx)) { throw 'No x64 WinGet dependencies found' }
          Remove-Item $download -Recurse -Force
      - name: Prepare the qualified WinGet client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $client = "$env:RUNNER_TEMP/winget-client"
          foreach ($dependency in Get-ChildItem "$client/dependencies" -Filter *.appx) {
            # A framework the image already has at a newer version needs no install.
            try { Add-AppxPackage -Path $dependency.FullName } catch { Write-Warning "$($dependency.Name): $($_.Exception.Message)" }
          }
          Add-AppxPackage -Path "$client/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" -ForceApplicationShutdown -ForceUpdateFromAnyVersion
          $version = winget --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne 'v1.29.380') { throw 'WinGet 1.29.380 is unavailable' }
      - name: Check WinGet against the retained ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable local manifests' }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $manifest = "target/distrib/winget/manifests/p/PederBergan/Esdieff/$version"
          winget validate --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Manifest validation failed' }
          $tool = (Resolve-Path target/release-tool/esdieff-release.exe).Path
          $portFile = "$env:RUNNER_TEMP/artifact-port"
          $server = Start-Process -FilePath $tool -ArgumentList @('serve-artifacts', (Resolve-Path target/distrib).Path, $portFile) -PassThru -NoNewWindow
          try {
            for ($i = 0; $i -lt 100 -and !(Test-Path $portFile); $i++) { Start-Sleep -Milliseconds 100 }
            $port = (Get-Content $portFile).Trim()
            $current = "$env:RUNNER_TEMP/current"
            $previous = "$env:RUNNER_TEMP/previous"
            Copy-Item $manifest $current -Recurse
            Get-ChildItem $current -Filter *.installer.yaml | ForEach-Object {
              $text = Get-Content $_.FullName -Raw
              $text = $text -replace 'https://github.com/pederbe/esdieff/releases/download/[^/]+/', "http://127.0.0.1:$port/"
              Set-Content $_.FullName $text -Encoding utf8
            }
            Copy-Item $current $previous -Recurse
            Get-ChildItem $previous -Filter *.yaml | ForEach-Object {
              (Get-Content $_.FullName -Raw) -replace "PackageVersion: $([regex]::Escape($version))", 'PackageVersion: 0.0.0' | Set-Content $_.FullName -Encoding utf8
            }
            # The previous version is a package-manager upgrade fixture.
            winget install --manifest $previous --accept-package-agreements --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw 'WinGet fixture installation failed' }
            winget upgrade --manifest $current --accept-package-agreements --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw 'WinGet upgrade failed' }
            $env:Path = [Environment]::ExpandEnvironmentVariables([Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User'))
            $binary = (Get-Command esdieff).Source
            & $tool smoke $binary $version
            if ($LASTEXITCODE -ne 0) { throw 'Installed command failed its useful operation' }
            winget uninstall --manifest $current --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw 'WinGet removal failed' }
            if (Test-Path $binary) { throw 'Removal left the installed command' }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: winget-manifests
          path: target/distrib/winget
          if-no-files-found: error
          retention-days: 30

  binstall:
    name: Binstall on ${{ matrix.os }}
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            format: txz
            archive: tar.xz
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            format: txz
            archive: tar.xz
          - os: macos-15
            target: aarch64-apple-darwin
            format: txz
            archive: tar.xz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            format: zip
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: archives-${{ matrix.target }}
          path: target/distrib
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-tool-${{ matrix.target }}
          path: target/release-tool
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: ./.github/actions/tool
        with:
          tool: cargo-binstall@1.26.1
          binary: cargo-binstall
      - name: Install the exact upstream archive layout without source fallback
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          suffix=''
          [[ "$TARGET" != *windows* ]] || suffix=.exe
          tool=$PWD/target/release-tool/esdieff-release$suffix
          chmod +x "$tool"
          "$tool" serve-artifacts target/distrib "$RUNNER_TEMP/binstall-port" &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in {1..100}; do test ! -f "$RUNNER_TEMP/binstall-port" || break; sleep 0.1; done
          port=$(cat "$RUNNER_TEMP/binstall-port")
          cargo binstall --no-confirm --allow-insecure-http --disable-strategies compile,quick-install \
            --manifest-path Cargo.toml --version "$version" \
            --pkg-url "http://127.0.0.1:$port/esdieff-{target}.$ARCHIVE" \
            --pkg-fmt "$PACKAGE_FORMAT" \
            --install-path "$RUNNER_TEMP/binstall-bin" esdieff
          "$tool" smoke "$RUNNER_TEMP/binstall-bin/esdieff$suffix" "$version"
          rm -rf "$RUNNER_TEMP/binstall-bin"
