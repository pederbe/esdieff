name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Select checks
    if: github.repository == 'pederbe/esdieff' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      release_tools: ${{ steps.paths.outputs.release_tools }}
      artifacts: ${{ steps.paths.outputs.artifacts }}
      docs: ${{ steps.paths.outputs.docs }}
      styles: ${{ steps.paths.outputs.styles }}
      website: ${{ steps.paths.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select applicable checks
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          rust=false
          release_tools=false
          artifacts=false
          docs=false
          styles=false
          website=false
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            rust=true
            release_tools=true
            artifacts=true
            docs=true
            styles=true
            website=true
          else
            # Inspect both paths when a rename crosses check scopes.
            git diff --no-renames --name-only -z "$BASE" HEAD > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                tools/release/tests/*|tools/release/src/distribution_checks.rs|tools/release/src/metadata.rs)
                  release_tools=true
                  ;;
                tools/release/*|.github/workflows/artifacts.yml|.github/workflows/release.yml|.github/workflows/distribution.yml|.github/workflows/package-repository.yml)
                  release_tools=true
                  artifacts=true
                  ;;
                .github/actions/*)
                  artifacts=true
                  docs=true
                  website=true
                  ;;
                # The checks job builds and tests every application change on each
                # platform. Release checks rebuild the archives only when what they
                # package or how they package it changes.
                .github/workflows/ci.yml|Cargo.toml|Cargo.lock|rust-toolchain.toml|dist-workspace.toml|about.toml|about.hbs|packaging/*|scripts/check-packages.sh)
                  rust=true
                  artifacts=true
                  ;;
                site/*|tools/site/*)
                  docs=true
                  styles=true
                  website=true
                  ;;
                docs/*|book.toml|CONTEXT.md|GLOSSARY.md|wrangler.jsonc|scripts/build-site.sh|.github/workflows/website.yml)
                  docs=true
                  website=true
                  ;;
                *.md)
                  docs=true
                  ;;
                .github/ISSUE_TEMPLATE/*|.github/FUNDING.yml|.github/workflows/release-plz.yml|release-plz.toml)
                  ;;
                *)
                  rust=true
                  ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          # Pull requests already passed validation against an up-to-date main.
          # After merging, select only website delivery. Manual and release
          # validation keep their full coverage.
          if [ "$EVENT" = push ]; then
            rust=false
            release_tools=false
            artifacts=false
            docs=false
            styles=false
          fi
          printf 'rust=%s\nrelease_tools=%s\nartifacts=%s\ndocs=%s\nstyles=%s\nwebsite=%s\n' "$rust" "$release_tools" "$artifacts" "$docs" "$styles" "$website" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.release_tools == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            tools/release -> target
            tools/terminal-html -> target
          shared-key: checks-${{ matrix.os }}
      - name: Run maintained checks
        run: bash scripts/check.sh ${{ needs.changes.outputs.rust == 'true' && '--all' || '--release-tools-only' }}

  # Pull requests can restore caches only from their own branch and main, and pushes to
  # main skip the checks. This job refills main's caches when the lock file, toolchain or a
  # pinned tool changes, so later pull requests restore them instead of rebuilding.
  warm:
    name: Warm caches (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, windows-2022, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.os == 'ubuntu-26.04'
        uses: ./.github/actions/tool
        with:
          tool: mdbook@0.5.4
          binary: mdbook
      - if: matrix.os != 'ubuntu-26.04'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - if: matrix.os != 'ubuntu-26.04'
        id: rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            tools/release -> target
            tools/terminal-html -> target
          shared-key: checks-${{ matrix.os }}
      - name: Compile the checks
        if: matrix.os != 'ubuntu-26.04' && steps.rust.outputs.cache-hit != 'true'
        run: bash scripts/check.sh --warm
      - if: matrix.os != 'ubuntu-26.04'
        uses: ./.github/actions/tool
        with:
          tool: cargo-about@0.9.3
          binary: cargo-about
      - if: matrix.os != 'ubuntu-26.04'
        uses: ./.github/actions/dist
      - if: matrix.os != 'ubuntu-26.04'
        uses: ./.github/actions/tool
        with:
          tool: cargo-binstall@1.26.1
          binary: cargo-binstall

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tool
        with:
          tool: mdbook@0.5.4
          binary: mdbook
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.styles == 'true'
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: tools/site/package-lock.json
      - name: Check generated landing styles
        if: needs.changes.outputs.styles == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/site
          npm run build:landing --prefix tools/site
          git diff --exit-code -- site/landing.css
      - name: Build documentation and check links
        run: bash scripts/build-site.sh

  artifacts:
    name: Release checks
    needs: changes
    if: needs.changes.outputs.artifacts == 'true'
    uses: ./.github/workflows/artifacts.yml
    with:
      tag: ${{ inputs.release_tag || '' }}

  website:
    needs: [changes, ci]
    if: >-
      !cancelled() && needs.ci.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.website == 'true' && vars.WEBSITE_ENABLED == 'true'
    uses: ./.github/workflows/website.yml
    with:
      deploy: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  ci:
    name: CI
    needs: [changes, checks, docs, artifacts]
    if: always() && (github.repository == 'pederbe/esdieff' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          ARTIFACTS_RESULT: ${{ needs.artifacts.result }}
          RUST_SELECTED: ${{ needs.changes.outputs.rust }}
          RELEASE_TOOLS_SELECTED: ${{ needs.changes.outputs.release_tools }}
          ARTIFACTS_SELECTED: ${{ needs.changes.outputs.artifacts }}
          DOCS_SELECTED: ${{ needs.changes.outputs.docs }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          if [ "$RUST_SELECTED" = true ] || [ "$RELEASE_TOOLS_SELECTED" = true ]; then
            test "$CHECKS_RESULT" = success
          else
            test "$CHECKS_RESULT" = skipped
          fi
          if [ "$ARTIFACTS_SELECTED" = true ]; then
            test "$ARTIFACTS_RESULT" = success
          else
            test "$ARTIFACTS_RESULT" = skipped
          fi
          if [ "$DOCS_SELECTED" = true ]; then
            test "$DOCS_RESULT" = success
          else
            test "$DOCS_RESULT" = skipped
          fi
