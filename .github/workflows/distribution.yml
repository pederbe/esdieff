name: Distribution updates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        default: v0.1.0
      submit_winget:
        description: Submit the updated WinGet manifests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: distribution
  cancel-in-progress: false

jobs:
  manifests:
    runs-on: windows-2025
    timeout-minutes: 15
    environment: ${{ inputs.submit_winget && 'distribution' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - name: Require automatic submission setup
        if: inputs.submit_winget
        shell: pwsh
        env:
          ENABLED: ${{ vars.WINGET_ENABLED }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          PRIVATE: ${{ github.event.repository.private }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PRIVATE -ne 'false' -or $env:RELEASE_ENABLED -ne 'true') { throw 'Release publication is not enabled' }
          if ($env:ENABLED -ne 'true') { throw 'Automatic WinGet submission is disabled' }
          if (!$env:WINGET_CREATE_GITHUB_TOKEN) { throw 'WINGET_TOKEN is not configured in the distribution environment' }
      - name: Download the published manifests and check their identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected a stable release tag' }
          $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.isPrerelease) { throw 'Expected a published stable release' }
          New-Item -Type Directory artifacts | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern esdieff-winget-manifests.tar.gz --pattern SHA256SUMS --dir artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Release artifacts are unavailable' }
          $line = Get-Content artifacts/SHA256SUMS | Where-Object { $_ -match '  esdieff-winget-manifests.tar.gz$' }
          if (!$line) { throw 'Manifest archive is missing from the release checksums' }
          $expected = ($line -split ' ')[0]
          if ((Get-FileHash artifacts/esdieff-winget-manifests.tar.gz -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Manifest checksum mismatch' }
          tar -xzf artifacts/esdieff-winget-manifests.tar.gz -C artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract manifests' }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: winget-update-${{ inputs.tag }}
          path: artifacts/manifests
          if-no-files-found: error
      - name: Validate and install the published manifest
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = "artifacts/manifests/p/PederBergan/Esdieff/$($env:TAG.Substring(1))"
          Install-PSResource -Name Microsoft.WinGet.Client -Scope CurrentUser -Repository PSGallery -TrustRepository
          Import-Module Microsoft.WinGet.Client
          $clientVersion = gh api repos/microsoft/winget-cli/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select the current stable WinGet client' }
          Repair-WinGetPackageManager -Version ($clientVersion.TrimStart('v')) -Force
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable local manifests' }
          # Local-manifest lifecycle checks do not use the Microsoft Store.
          winget source remove --name msstore
          if ($LASTEXITCODE -ne 0) { throw 'Cannot isolate the community-source check' }
          winget validate --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Manifest validation failed' }
          winget install --manifest $manifest --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'Manifest installation failed' }
          try {
            $env:Path = [Environment]::ExpandEnvironmentVariables([Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User'))
            $binary = (Get-Command esdieff).Source
            cargo run --locked --manifest-path tools/release/Cargo.toml -- smoke $binary ($env:TAG.Substring(1))
            if ($LASTEXITCODE -ne 0) { throw 'Installed command check failed' }
          } finally {
            winget uninstall --name Esdieff --exact --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw 'WinGet removal failed' }
            if (Test-Path $binary) { throw 'Removal left the installed command' }
          }
      - name: Check the official WinGet Create client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api repos/microsoft/winget-create/releases/latest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select WinGetCreate' }
          $asset = $release.assets | Where-Object name -eq wingetcreate.exe
          if (!$asset -or $asset.digest -notmatch '^sha256:([0-9a-f]{64})$') { throw 'WinGetCreate checksum unavailable' }
          $client = "$env:RUNNER_TEMP/wingetcreate.exe"
          gh release download $release.tag_name --repo microsoft/winget-create --pattern wingetcreate.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download WinGetCreate' }
          if ((Get-FileHash $client -Algorithm SHA256).Hash.ToLower() -ne $asset.digest.Substring(7)) { throw 'WinGetCreate checksum mismatch' }
          & $client
          if ($LASTEXITCODE -ne 0) { throw 'WinGetCreate cannot start' }
      - name: Prepare or complete the WinGet pull request
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          SUBMIT: ${{ inputs.submit_winget }}
          GH_TOKEN: ${{ inputs.submit_winget && secrets.WINGET_TOKEN || github.token }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGET_CHECKED: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WINGET_CREATE = "$env:RUNNER_TEMP/wingetcreate.exe"
          $mode = if ($env:SUBMIT -eq 'true') { '--submit' } else { '--prepare' }
          cargo run --locked --manifest-path tools/release/Cargo.toml -- winget-submit "artifacts/manifests/p/PederBergan/Esdieff/$($env:TAG.Substring(1))" PederBergan.Esdieff ($env:TAG.Substring(1)) $mode
          if ($LASTEXITCODE -ne 0) { throw 'WinGet preparation or submission failed; retry this version' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: winget-description-${{ inputs.tag }}
          path: winget-pr-body.md
          if-no-files-found: ignore
