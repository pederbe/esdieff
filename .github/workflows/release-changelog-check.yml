name: Release changelog checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-changelog-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: CI
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a single-file changelog update
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == contrib/release-changelog-v* ]]
          git fetch origin main
          test "$(git diff --name-only origin/main...HEAD)" = CHANGELOG.md
          git diff --check origin/main...HEAD
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Check changelog tooling
        run: bash scripts/check-release-changelog.sh
      - name: Install mdBook
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/mdbook.tar.gz" \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/mdbook"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook" mdbook
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Build documentation and check links
        run: bash scripts/build-site.sh
