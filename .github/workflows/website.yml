name: Website

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        default: v0.1.0
      deploy:
        description: Deploy the checked website
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Build the website and check its links
        run: bash scripts/build-site.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: website
          path: target/site
          if-no-files-found: error
  deploy:
    needs: build
    if: inputs.deploy && vars.WEBSITE_ENABLED == 'true' && !github.event.repository.private
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: website
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: website
          path: target/site
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: tools/site/package-lock.json
      - name: Verify the release is current and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$TAG" = "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/site
          npx --prefix tools/site wrangler deploy --config wrangler.jsonc
          curl --fail --retry 5 --retry-delay 3 https://esdieff.com/ > /dev/null
          curl --fail --retry 5 --retry-delay 3 https://esdieff.com/docs/ > /dev/null
