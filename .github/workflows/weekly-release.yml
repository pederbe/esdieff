name: Weekly release

on:
  # Enable the Monday schedule after the first public release.
  workflow_dispatch:
    inputs:
      check_only:
        description: Prepare without creating or publishing a tag
        type: boolean
        default: true
      increment:
        description: Version increment
        type: choice
        options: [auto, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (inputs.check_only || (vars.WEEKLY_RELEASE_ENABLED == 'true' && !github.event.repository.private))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exercise release preparation
        run: cargo test --locked --manifest-path tools/release/Cargo.toml
      - name: Freeze or resume a candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ONLY: ${{ inputs.check_only }}
          INCREMENT: ${{ inputs.increment || 'auto' }}
        run: |
          set -euo pipefail
          if ! previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); then
            test "$CHECK_ONLY" = true
            echo 'Initial release preparation checks passed. No published baseline exists yet.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          source=$(git rev-parse HEAD)
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$source/check-runs" --jq '[.check_runs[] | select(.name == "CI" and .conclusion == "success")] | length')
          test "$conclusion" -gt 0
          newest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ "$newest" != "$previous" ]; then
            test "$(git show -s --format=%s "$newest")" = "Prepare automated release $newest"
            tag=$newest
          else
            cargo run --locked --manifest-path tools/release/Cargo.toml -- prepare-weekly "$previous" "$(date -u +%F)" "$INCREMENT" "$RUNNER_TEMP/plan" "$newest"
            if grep -qx changed=false "$RUNNER_TEMP/plan"; then exit 0; fi
            tag=$(sed -n 's/^tag=//p' "$RUNNER_TEMP/plan")
            if [ "$CHECK_ONLY" = true ]; then cat "$RUNNER_TEMP/plan"; exit 0; fi
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Cargo.toml Cargo.lock CHANGELOG.md
            git commit -m "Prepare automated release $tag"
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          if [ "$CHECK_ONLY" = true ]; then echo "Would resume $tag"; exit 0; fi
          sha=$(git rev-parse "$tag^{commit}")
          gh run list --workflow release.yml --commit "$sha" --limit 1 --json databaseId,status,conclusion > "$RUNNER_TEMP/runs.json"
          run=$(jq -r '.[0].databaseId // empty' "$RUNNER_TEMP/runs.json")
          if [ -z "$run" ]; then
            gh workflow run release.yml --ref "$tag" -f tag="$tag" -f publish=true
          elif [ "$(jq -r '.[0].status' "$RUNNER_TEMP/runs.json")" != completed ]; then
            echo "Release $tag already has an active run."
          elif [ "$(jq -r '.[0].conclusion' "$RUNNER_TEMP/runs.json")" != success ]; then
            gh run rerun "$run" --failed
          fi
