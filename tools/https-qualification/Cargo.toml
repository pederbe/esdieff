[package]
name = "esdieff-https-qualification"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-provider-rustcrypto-pq = "=0.1.1"
sha2 = "=0.11.1"

[lints.rust]
unsafe_code = "forbid"
