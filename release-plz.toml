[workspace]
# The Release workflow builds, verifies and publishes each tag.
publish = false
git_release_enable = false
git_tag_name = "v{{ version }}"
# Release only when the weekly release pull request merges.
release_always = false
# Release only for changes that appear in the changelog, so every release has
# notes. These are feat:, fix:, perf:, docs:, breaking changes and unprefixed
# titles that start with a capital letter.
release_commits = '^([A-Z]|(feat|fix|perf|docs)[(:!]|[a-z]+(\([^)]*\))?!:)|BREAKING[ -]CHANGE'
pr_name = "chore: release v{{ version }}"

[changelog]
header = """# Changelog

## [Unreleased]
"""
body = """

## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits | unique(attribute="message") %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %}
  {{ commit.breaking_description | split(pat="\n") | first | trim | upper_first }}\
{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true
sort_commits = "oldest"
protect_breaking_commits = true
commit_preprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/pederbe/esdieff/pull/${1}))" },
]
commit_parsers = [
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { body = "BREAKING[ -]CHANGE", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix\\(deps\\)", group = "<!-- 4 -->Dependencies" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^(chore|ci|build|test|style|refactor)", skip = true },
  { message = ".*", group = "<!-- 6 -->Other changes" },
]
