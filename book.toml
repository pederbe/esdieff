[book]
title = "Esdieff"
description = "An SDF toolkit for connected-device models. Explore interfaces, catch mistakes, compare revisions and generate test values."
authors = ["Peder Bergan"]
language = "en"
src = "docs"

[build]
build-dir = "target/book"
create-missing = false

[output.html]
theme = "docs/theme"
site-url = "/docs/"
git-repository-url = "https://github.com/pederbe/esdieff"
edit-url-template = "https://github.com/pederbe/esdieff/edit/main/{path}"
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["docs/theme/esdieff.css"]
additional-js = ["docs/theme/navigation.js", "docs/theme/footer.js", "docs/theme/process-map.js"]
no-section-label = true

[output.html.redirect]
"/README.html" = "index.html"
"/getting-started/README.html" = "index.html"
# Decision records are kept in the repository. Their former pages lead there.
"/adr/index.html" = "https://github.com/pederbe/esdieff/blob/main/docs/adr/README.md"
