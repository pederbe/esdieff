<svg xmlns="http://www.w3.org/2000/svg" width="760" height="674" viewBox="0 0 760 674" role="img" aria-labelledby="title desc">
  <title id="title">Esdieff process overview</title>
  <desc id="desc">Local SDF files or explicitly acquired snapshots form a catalogue. Source inspection reads retained content. Effective views resolve supplied definitions and report implicit defaults separately. Model checks, revision comparison and value testing produce results with evidence.</desc>
  <style>
    svg { --bg: #fdf0d5; --fg: #003049; --panel: #f6e4c2; --line: #669bbc; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; }
    rect { fill: var(--panel); stroke: var(--line); }
    text { fill: var(--fg); text-anchor: middle; }
    .heading { font-weight: 600; }
    .detail { font-size: 13px; }
    .wire { fill: none; stroke: var(--line); stroke-width: 1.5; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) { svg { --bg: #003049; --fg: #fdf0d5; --panel: #001c2b; --line: #85afc9; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--line)"/></marker></defs>
